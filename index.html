
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-card">
    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Eat • Grow • Beat Your Record!</p>

    <div class="stats">
      <div class="stat">
        <span>⭐ Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>🏆 Best</span>
        <strong id="highScore">0</strong>
      </div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="message">Ready to Play?</h2>
        <p id="messageText">Press Start and enjoy the game!</p>
      </div>
    </div>

    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="160">Easy</option>
      <option value="110" selected>Moderate</option>
      <option value="70">Hard</option>
    </select>

    <div class="actions">
      <button id="startBtn">▶ Start</button>
      <button id="pauseBtn" disabled>⏸ Pause</button>
      <button id="restartBtn">🔄 Restart</button>
      <button id="soundBtn">🔊 Sound On</button>
    </div>

    <p class="help">Use arrow keys or the buttons below.</p>

    <div class="controls">
      <button data-dir="up" aria-label="Up">⬆️</button>
      <div>
        <button data-dir="left" aria-label="Left">⬅️</button>
        <button data-dir="down" aria-label="Down">⬇️</button>
        <button data-dir="right" aria-label="Right">➡️</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
